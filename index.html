<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b1a">
  <title>海盜大戰觸手 Tentacle Panic</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="stage">
    <canvas id="game" width="320" height="180"></canvas>

    <!-- 遊戲中的資訊列 -->
    <div id="hud" class="hidden">
      <div class="hud-left">
        <div id="hud-level"></div>
        <div id="hud-hull"></div>
      </div>
      <div class="hud-right">
        <div class="hud-row">
          <div id="hud-time"></div>
          <button id="btn-pause" class="btn small" aria-label="pause">II</button>
        </div>
        <div id="hud-score"></div>
        <div id="hud-combo"></div>
      </div>
      <div id="hud-boss" class="hidden">
        <span data-i18n="bossName"></span>
        <div class="bar"><div id="hud-boss-fill"></div></div>
      </div>
    </div>

    <div id="banner" class="hidden"></div>

    <!-- 標題畫面 -->
    <section id="screen-title" class="screen">
      <h1 class="game-title" data-i18n="title"></h1>
      <p class="game-sub" data-i18n="subtitle"></p>
      <div class="menu">
        <button class="btn big" id="btn-start" data-i18n="start"></button>
        <div class="row">
          <button class="btn" id="btn-how" data-i18n="how"></button>
          <button class="btn" id="btn-lang" data-i18n="lang"></button>
          <button class="btn" id="btn-sound"></button>
        </div>
      </div>
    </section>

    <!-- 玩法說明 -->
    <section id="screen-how" class="screen dim hidden">
      <div class="panel">
        <h2 data-i18n="howTitle"></h2>
        <ul id="how-list"></ul>
        <button class="btn" id="btn-how-close" data-i18n="close"></button>
      </div>
    </section>

    <!-- 航海地圖（選關） -->
    <section id="screen-map" class="screen hidden">
      <div class="map-top">
        <button class="btn small" id="btn-map-back" data-i18n="back"></button>
        <h2 data-i18n="mapTitle"></h2>
      </div>
      <div class="map-info">
        <div>
          <div id="map-name"></div>
          <div id="map-detail"></div>
        </div>
        <button class="btn" id="btn-sail" data-i18n="sail"></button>
      </div>
    </section>

    <!-- 暫停 -->
    <section id="screen-pause" class="screen dim hidden">
      <div class="panel">
        <h2 data-i18n="paused"></h2>
        <button class="btn" id="btn-resume" data-i18n="resume"></button>
        <button class="btn" id="btn-restart" data-i18n="restart"></button>
        <button class="btn" id="btn-pause-map" data-i18n="toMap"></button>
      </div>
    </section>

    <!-- 結算 -->
    <section id="screen-result" class="screen dim hidden">
      <div class="panel">
        <h2 id="result-title"></h2>
        <div id="result-stars"></div>
        <div id="result-score"></div>
        <div id="result-best"></div>
        <div class="row">
          <button class="btn" id="btn-result-map" data-i18n="toMap"></button>
          <button class="btn" id="btn-retry" data-i18n="retry"></button>
          <button class="btn" id="btn-next" data-i18n="next"></button>
        </div>
      </div>
    </section>

    <!-- 全部通關 -->
    <section id="screen-ending" class="screen hidden">
      <div class="ending-top" data-i18n="allClear"></div>
      <div class="ending-bottom">
        <button class="btn small" id="btn-ending-map" data-i18n="toMap"></button>
      </div>
    </section>
  </div>

  <div id="rotate-hint" data-i18n="rotate"></div>

  <script src="js/data.js"></script>
  <script src="js/art.js"></script>
  <script src="js/ending.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/game.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
